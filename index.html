<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Милый Бот</title>
    
    <meta name="theme-color" content="#f4f0fb" id="meta-theme-color">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg-color: #f4f0fb;
            /* ИСПРАВЛЕНО: бд вместо бг */
            --bg-image: url('bd_day.jpg'); 
            --bg-gradient: linear-gradient(135deg, rgba(244, 240, 251, 0.6), rgba(230, 220, 250, 0.6));
            
            --card-bg: rgba(255, 255, 255, 0.55);
            --card-border: rgba(255, 255, 255, 0.8);
            --card-shadow: 0 20px 40px rgba(167, 139, 250, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            
            --text-color: #3b2a45;
            --h1-color: #7e57c2;
            --h1-shadow: 0 1px 2px rgba(255,255,255,0.8);

            --btn-menu-bg: linear-gradient(135deg, #a78bfa 0%, #c4b5fd 100%);
            --btn-menu-text: #ffffff;
            --btn-menu-shadow: 0 8px 24px rgba(167, 139, 250, 0.4);

            --btn-action-bg: linear-gradient(135deg, #c084fc 0%, #f472b6 100%);
            --btn-action-text: #ffffff;
            --btn-action-shadow: 0 6px 16px rgba(192, 132, 252, 0.3);
            
            --btn-meme-bg: linear-gradient(135deg, #a78bfa 0%, #93c5fd 100%);
            --btn-meme-text: #ffffff;
            --btn-meme-shadow: 0 6px 16px rgba(167, 139, 250, 0.3);

            --btn-movie-bg: linear-gradient(135deg, #c4b5fd 0%, #e9d5ff 100%);
            --btn-movie-text: #4c1d95;
            --btn-movie-shadow: 0 6px 16px rgba(196, 181, 253, 0.4);

            --btn-hug-bg: linear-gradient(135deg, #f9a8d4 0%, #fbcfe8 100%);
            --btn-hug-text: #831843;
            --btn-hug-shadow: 0 6px 16px rgba(249, 168, 212, 0.4);

            --message-box-bg: rgba(255, 255, 255, 0.4);
            --message-box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 4px 12px rgba(167, 139, 250, 0.08);
            
            --mood-bg: rgba(255, 255, 255, 0.4);
            --mood-hover: rgba(167, 139, 250, 0.2);

            --skeleton-bg: rgba(255, 255, 255, 0.2);
            --skeleton-shine: rgba(255, 255, 255, 0.6);
        }

        body.night-mode {
            --bg-color: #0f1123;
            /* ИСПРАВЛЕНО: бд вместо бг */
            --bg-image: url('bd_night.jpg'); 
            --bg-gradient: linear-gradient(135deg, rgba(15, 17, 35, 0.8), rgba(15, 17, 35, 0.95));
            
            --card-bg: rgba(30, 27, 75, 0.6);
            --card-border: rgba(167, 139, 250, 0.2);
            --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            
            --text-color: #e2e8f0;
            --h1-color: #c4b5fd; 
            --h1-shadow: 0 2px 4px rgba(0,0,0,0.6);

            --btn-menu-bg: linear-gradient(135deg, #6d28d9 0%, #8b5cf6 100%);
            --btn-menu-text: #ffffff;
            --btn-menu-shadow: 0 8px 24px rgba(109, 40, 217, 0.5);

            --btn-action-bg: linear-gradient(135deg, #7e22ce 0%, #a21caf 100%);
            --btn-action-text: #ffffff;
            --btn-action-shadow: 0 6px 16px rgba(126, 34, 206, 0.4);
            
            --btn-meme-bg: linear-gradient(135deg, #1e3a8a 0%, #312e81 100%);
            --btn-meme-text: #bfdbfe;
            --btn-meme-shadow: 0 6px 16px rgba(30, 58, 138, 0.5);

            --btn-movie-bg: linear-gradient(135deg, #312e81 0%, #1e1b4b 100%);
            --btn-movie-text: #e0e7ff;
            --btn-movie-shadow: 0 6px 16px rgba(49, 46, 129, 0.5);

            --btn-hug-bg: linear-gradient(135deg, #831843 0%, #4c0519 100%);
            --btn-hug-text: #fce7f3;
            --btn-hug-shadow: 0 6px 16px rgba(131, 24, 67, 0.5);

            --message-box-bg: rgba(30, 27, 75, 0.4);
            --message-box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 12px rgba(0, 0, 0, 0.4);
            
            --mood-bg: rgba(30, 27, 75, 0.4);
            --mood-hover: rgba(139, 92, 246, 0.3);

            --skeleton-bg: rgba(30, 27, 75, 0.4);
            --skeleton-shine: rgba(167, 139, 250, 0.1);
        }

        html {
            background-color: var(--bg-color);
            transition: background-color 0.5s ease;
        }

        body {
            background-color: transparent;
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: hidden;
            justify-content: flex-start;
            min-height: 100vh;
            min-height: 100dvh; 
            margin: 0;
            padding: calc(60px + env(safe-area-inset-top)) 15px calc(30px + env(safe-area-inset-bottom)) 15px;
            box-sizing: border-box;
            text-align: center;
            transition: color 0.5s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overscroll-behavior-y: none;
        }

        .bg-layer {
            position: fixed;
            top: 0; bottom: 0; left: 0; right: 0;
            z-index: -1; 
            background-color: var(--bg-color);
            background-image: var(--bg-gradient), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-color 0.5s ease;
            pointer-events: none;
        }

        #particles-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            bottom: -20px;
            background: var(--h1-color);
            border-radius: 50%;
            opacity: 0.15;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 0.3; }
            90% { opacity: 0.3; }
            100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
        }

        .top-controls {
            position: fixed;
            top: calc(15px + env(safe-area-inset-top));
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 500;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            color: var(--h1-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.5s, color 0.5s;
            padding: 0;
        }
        .icon-btn:active { transform: scale(0.88); }
        .icon-btn svg { width: 20px; height: 20px; transition: transform 0.4s; }
        .icon-btn.playing svg { animation: musicPulse 1.5s infinite alternate; }
        
        @keyframes musicPulse {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            padding: 24px 15px;
            border-radius: 32px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.5s ease, box-shadow 0.5s ease;
            margin-bottom: 20px;
            z-index: 10;
            animation: cardBreathe 6s ease-in-out infinite;
        }

        @keyframes cardBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }

        h1 {
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: -0.6px;
            line-height: 1.3;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--h1-color);
            text-shadow: var(--h1-shadow);
            transition: color 0.5s ease;
            white-space: nowrap; 
            width: 100%;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis; 
        }

        .content-area {
            width: 100%;
            height: 260px; 
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 16px;
            background: var(--message-box-bg);
            box-shadow: var(--message-box-shadow);
        }

        .message-box, .media-box {
            width: 100%;
            height: 100%;
            display: none; 
            border-radius: 20px;
            box-sizing: border-box;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
            overflow: hidden;
        }

        .message-box {
            padding: 24px;
            background: transparent;
            overflow-y: auto;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex-direction: column;
            word-wrap: break-word;
            z-index: 10; /* Чтобы текст был поверх видео, если они наложатся */
        }

        #mediaDisplay {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .movie-quote-text {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 16px;
            font-style: italic;
            letter-spacing: -0.2px;
            display: none;
        }
        .movie-meta-info {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.7;
            color: var(--h1-color);
            display: none;
        }

        .media-box {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent;
            padding: 0;
        }

        .media-box img, .media-box video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: 100%;
            display: block;
            border-radius: 0;
        }

        #funnyImage { object-fit: contain; }
        #introVideo { object-fit: cover; }

        .skeleton-loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--skeleton-bg);
            display: none;
            background-image: linear-gradient(90deg, transparent, var(--skeleton-shine), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .mood-tracker {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 16px;
            background: var(--mood-bg);
            padding: 8px 12px;
            border-radius: 18px;
            box-sizing: border-box;
            border: 1px solid var(--card-border);
        }

        .mood-btn {
            background: transparent;
            border: none;
            font-size: 22px;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
            filter: grayscale(0.5);
            padding: 6px;
            border-radius: 50%;
        }
        .mood-btn:hover, .mood-btn:active {
            transform: scale(1.3);
            filter: grayscale(0);
            background: var(--mood-hover);
        }
        .mood-btn.selected {
            filter: grayscale(0);
            transform: scale(1.2);
            background: var(--mood-hover);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            border: none;
            padding: 16px 20px;
            font-size: 15px;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 0.2px;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, background 0.5s;
            display: flex; align-items: center; justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        button span { position: relative; z-index: 2; pointer-events: none; }
        
        button:active { transform: scale(0.95); box-shadow: none; }

        #toggleMenuBtn {
            background: var(--btn-menu-bg);
            color: var(--btn-menu-text);
            box-shadow: var(--btn-menu-shadow);
            z-index: 10;
            position: relative;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease, margin-top 0.3s ease;
        }

        .menu-container.active {
            max-height: 400px;
            opacity: 1;
            margin-top: 12px;
        }

        #actionButton { background: var(--btn-action-bg); color: var(--btn-action-text); box-shadow: var(--btn-action-shadow); }
        #memeButton { background: var(--btn-meme-bg); color: var(--btn-meme-text); box-shadow: var(--btn-meme-shadow); }
        #movieButton { background: var(--btn-movie-bg); color: var(--btn-movie-text); box-shadow: var(--btn-movie-shadow); }
        #hugButton { background: var(--btn-hug-bg); color: var(--btn-hug-text); box-shadow: var(--btn-hug-shadow); }

        #hearts-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .heart {
            position: absolute;
            bottom: -20px;
            font-size: 24px;
            animation: floatUp 2.5s linear forwards;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            20% { opacity: 1; transform: translateY(-20vh) scale(1) rotate(15deg); }
            80% { opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.2) rotate(-15deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div id="particles-container"></div>
    <div id="hearts-container"></div>

    <audio id="bgMusic" loop src="music/bg.mp3"></audio>

    <div class="top-controls">
        <button class="icon-btn" id="musicToggleBtn" aria-label="Включить музыку">
            <svg id="musicIcon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
        </button>
        <button class="icon-btn" id="themeToggleBtn" aria-label="Сменить тему">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="currentColor"></svg>
        </button>
    </div>

    <div class="card">
        <h1>✨ Иногда нужно немного тепла ✨</h1>

        <div class="content-area">
            <!-- Добавили стили, чтобы greeting показывался поверх видео -->
            <div class="message-box" id="messageDisplay" style="display: flex; position: absolute; z-index: 20; background: rgba(0,0,0,0.3); border-radius: 20px;">тыкой сюдой 🥺</div>

            <div class="media-box" id="mediaDisplay">
                <video id="introVideo" autoplay loop muted playsinline>
                    <!-- Изменили путь, чтобы подхватывало из корня -->
                    <source src="intro.mp4" type="video/mp4">
                    <source src="videos/intro.mp4" type="video/mp4">
                </video>
                <div class="skeleton-loader" id="memeSkeleton"></div>
                <img id="funnyImage" alt="смешная картинка" style="display: none;">
            </div>
        </div>

        <div class="mood-tracker" id="moodTracker">
            <button class="mood-btn" data-mood="Радость 🥰">🥰</button>
            <button class="mood-btn" data-mood="Спокойствие 😊">😊</button>
            <button class="mood-btn" data-mood="Грусть 🥺">🥺</button>
            <button class="mood-btn" data-mood="Усталость 😴">😴</button>
            <button class="mood-btn" data-mood="Злость 😡">😡</button>
        </div>

        <button id="toggleMenuBtn"><span>✨ Выбрать действие ▼</span></button>
        
        <div class="menu-container" id="menuContainer">
            <button id="hugButton"><span>🤗 Обнять</span></button>
            <button id="actionButton"><span>💖 Получить милоту</span></button>
            <button id="memeButton"><span>😂 Показать смешное</span></button>
            <button id="movieButton"><span>🎬 Момент из фильма</span></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram && window.Telegram.WebApp;
            
            if (tg) {
                tg.ready(); 
                tg.expand();
            }

            function hapticFeedback(type = 'light') {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred(type);
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            let userName = urlParams.get('uname');
            if (!userName && tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const u = tg.initDataUnsafe.user;
                userName = u.first_name || "Без имени";
                if (u.last_name) userName += " " + u.last_name;
                if (u.username) userName += " (@" + u.username + ")";
            }
            if (!userName) userName = "Неизвестный пользователь";

            function logAction(actionName) {
                const now = new Date().toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' });
                fetch('/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: actionName, time: now, user: userName })
                }).catch(err => console.log('Ошибка логирования', err));
            }

            const particlesContainer = document.getElementById('particles-container');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 4 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.animationDuration = `${Math.random() * 10 + 10}s`;
                particle.style.animationDelay = `${Math.random() * 10}s`;
                particlesContainer.appendChild(particle);
            }

            const messageDisplay = document.getElementById('messageDisplay');
            let typingTimeout;
            
            function typeWriter(element, text, speed = 30) {
                clearTimeout(typingTimeout);
                element.innerHTML = ''; 
                let i = 0;
                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        typingTimeout = setTimeout(type, speed);
                    }
                }
                type();
            }

            function getGreeting() {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 12) return "Доброе утро! Надеюсь, ты выспалась ☀️";
                if (hour >= 12 && hour < 18) return "Как проходит твой день? Я всегда рядом ✨";
                if (hour >= 18 && hour < 23) return "Хорошего вечера! Не забудь отдохнуть 🌙";
                return "Уже поздно, не забудь поспать, чтобы завтра быть полной сил 💜";
            }

            // Выводим приветствие
            setTimeout(() => {
                typeWriter(messageDisplay, getGreeting(), 40);
            }, 500);

            // Убираем приветствие при первом клике на любую кнопку, чтобы не мешало видео
            const allButtons = document.querySelectorAll('button');
            allButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (messageDisplay.style.display === 'flex' && messageDisplay.style.position === 'absolute') {
                        messageDisplay.style.display = 'none';
                    }
                });
            });

            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const themeIcon = document.getElementById('themeIcon');
            const metaThemeColor = document.getElementById('meta-theme-color');
            const ICON_SUN = '<path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"/>';
            const ICON_MOON = '<path d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"/>';
            
            function applyTheme(isNight) {
                if (isNight) {
                    document.body.classList.add('night-mode');
                    themeIcon.innerHTML = ICON_SUN; 
                    if(metaThemeColor) metaThemeColor.setAttribute('content', '#0f1123');
                } else {
                    document.body.classList.remove('night-mode');
                    themeIcon.innerHTML = ICON_MOON; 
                    if(metaThemeColor) metaThemeColor.setAttribute('content', '#f4f0fb');
                }
            }

            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'night') {
                applyTheme(true);
            } else if (savedTheme === 'day') {
                applyTheme(false);
            } else {
                applyTheme(new Date().getHours() >= 19 || new Date().getHours() < 9);
            }

            themeToggleBtn.addEventListener('click', () => {
                hapticFeedback('medium');

            function shuffle(array) {
                let currentIndex = array.length, randomIndex;
                while (currentIndex !== 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
                return array;
            }

                        [bag[bag.length - 1], bag[0]] = [bag[0], bag[bag.length - 1]];
                    }
                }
                return bag.pop();
            }

                    metaDiv.textContent = `🎬 ${nextMovie.title} • ${nextMovie.time}`;
                    messageDisplay.appendChild(metaDiv);

                    typeWriter(quoteDiv, `«${nextMovie.quote}»`, 35);
                    
                    setTimeout(() => {
                        metaDiv.style.display = 'block';
                    }, nextMovie.quote.length * 35 + 200);

                }, 200);
            });
        });
    </script>
</body>
</html>
